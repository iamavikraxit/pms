services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: laravel_app
    restart: unless-stopped
    working_dir: /var/www
    environment:
      APP_NAME: ${APP_NAME}
      APP_ENV: ${APP_ENV}
      APP_KEY: ${APP_KEY}
      APP_DEBUG: ${APP_DEBUG}
      APP_URL: ${APP_URL}
      APP_LOCALE: ${APP_LOCALE}
      APP_FALLBACK_LOCALE: ${APP_FALLBACK_LOCALE}
      APP_FAKER_LOCALE: ${APP_FAKER_LOCALE}
      APP_MAINTENANCE_DRIVER: ${APP_MAINTENANCE_DRIVER}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS}
      LOG_CHANNEL: ${LOG_CHANNEL}
      LOG_STACK: ${LOG_STACK}
      LOG_LEVEL: ${LOG_LEVEL}
      DB_CONNECTION: ${DB_CONNECTION}
      READ_DB_HOST: ${READ_DB_HOST}
      READ_DB_PORT: ${READ_DB_PORT}
      READ_DB_DATABASE: ${READ_DB_DATABASE}
      READ_DB_USERNAME: ${READ_DB_USERNAME}
      READ_DB_PASSWORD: ${READ_DB_PASSWORD}
      WRITE_DB_HOST: ${WRITE_DB_HOST}
      WRITE_DB_PORT: ${WRITE_DB_PORT}
      WRITE_DB_DATABASE: ${WRITE_DB_DATABASE}
      WRITE_DB_USERNAME: ${WRITE_DB_USERNAME}
      WRITE_DB_PASSWORD: ${WRITE_DB_PASSWORD}
      SESSION_DRIVER: ${SESSION_DRIVER}
      SESSION_LIFETIME: ${SESSION_LIFETIME}
      SESSION_ENCRYPT: ${SESSION_ENCRYPT}
      SESSION_PATH: ${SESSION_PATH}
      BROADCAST_CONNECTION: ${BROADCAST_CONNECTION}
      FILESYSTEM_DISK: ${FILESYSTEM_DISK}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION}
      CACHE_STORE: ${CACHE_STORE}
      MEMCACHED_HOST: ${MEMCACHED_HOST}
      REDIS_CLIENT: ${REDIS_CLIENT}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      MAIL_MAILER: ${MAIL_MAILER}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION}
      AWS_USE_PATH_STYLE_ENDPOINT: ${AWS_USE_PATH_STYLE_ENDPOINT}
      VITE_APP_NAME: ${VITE_APP_NAME}
      ASSET_URL: ${ASSET_URL}
    networks:
      - laravel

  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    container_name: laravel_nginx
    hostname: pms
    restart: unless-stopped
    # ports:
    #   - "80:80"
    volumes:
      # - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - laravel

  db:
    image: postgis/postgis:17-master
    container_name: pms_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${WRITE_DB_DATABASE}
      POSTGRES_USER: ${WRITE_DB_USERNAME}
      POSTGRES_PASSWORD: ${WRITE_DB_PASSWORD}
    volumes:
      - dbdata:/var/lib/postgresql/data
    networks:
      - laravel

  pgadmin:
    image: dpage/pgadmin4
    container_name: pms_pgadmin
    hostname: pgadmin.pms
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: pms@gmail.com
      PGADMIN_DEFAULT_PASSWORD: pms
    networks:
      - laravel
    depends_on:
      - db

networks:
  laravel:

volumes:
  dbdata:
    external: true
    name: pms_data_base